<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sin conexión · Cromio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6E3F" />
    <link rel="icon" href="/cromio_bg.png" type="image/png" />
    <link rel="apple-touch-icon" href="/cromio_bg.png" />
    <style>
      :root {
        --bone: #fafaf7;
        --line: #e8e6de;
        --text: #1a1a1a;
        --text-2: #5c5a50;
        --green-700: #117c4e;
        --green-500: #1fae5a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        background: var(--bone);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 88px; height: 88px;
        margin: 0 auto 16px;
        border-radius: 22px;
        background: linear-gradient(160deg, var(--green-500), var(--green-700));
        display: grid; place-items: center;
        box-shadow: 0 8px 24px rgba(11,28,18,.15);
      }
      .icon svg { width: 44px; height: 44px; color: #fff; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.5; color: var(--text-2); margin: 0 0 18px; }
      button {
        appearance: none;
        font: inherit; font-weight: 700;
        height: 44px; padding: 0 20px;
        border-radius: 12px; border: 0; cursor: pointer;
        background: var(--green-500); color: #fff;
        box-shadow: 0 4px 14px rgba(11,28,18,.08);
      }
      button:active { transform: translateY(1px); }
      .hint { margin-top: 14px; font-size: 12px; color: var(--text-2); }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.82a15 15 0 0 1 20 0" opacity=".35" />
          <path d="M5 12.86a10 10 0 0 1 14 0" opacity=".7" />
          <path d="M8.5 16.5a5 5 0 0 1 7 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
          <line x1="2" y1="2" x2="22" y2="22" />
        </svg>
      </div>
      <h1>Sin conexión</h1>
      <p>
        No conseguimos conectar con Cromio ahora mismo. Tu colección y tus chats
        están guardados — recargaremos cuando vuelva la red.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <p class="hint">Si el problema sigue, verifica tu wifi o datos móviles.</p>
    </main>
  </body>
</html>
