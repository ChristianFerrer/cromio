<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cromio · Mockup — Radar (Estadio nocturno)</title>
    <link rel="stylesheet" href="_tokens.css" />
    <link rel="stylesheet" href="_components.css" />
    <style>
      body { overflow: hidden; }
      .map-frame {
        position: relative;
        min-height: 100dvh;
        background: var(--map-bg);
        overflow: hidden;
      }

      /* Simulated CartoDB Dark Matter tiles */
      .map-canvas {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(60deg, transparent 47%, rgba(255, 255, 255, 0.06) 47%, rgba(255, 255, 255, 0.06) 53%, transparent 53%),
          linear-gradient(120deg, transparent 47%, rgba(255, 255, 255, 0.045) 47%, rgba(255, 255, 255, 0.045) 53%, transparent 53%),
          linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
          radial-gradient(ellipse at 30% 40%, rgba(31, 174, 90, 0.04), transparent 50%),
          var(--map-bg);
        background-size: 200px 200px, 240px 240px, 32px 32px, 32px 32px, 100% 100%, 100% 100%;
      }
      [data-theme="light"] .map-canvas {
        background:
          linear-gradient(60deg, transparent 47%, rgba(0, 0, 0, 0.05) 47%, rgba(0, 0, 0, 0.05) 53%, transparent 53%),
          linear-gradient(120deg, transparent 47%, rgba(0, 0, 0, 0.04) 47%, rgba(0, 0, 0, 0.04) 53%, transparent 53%),
          linear-gradient(rgba(0, 0, 0, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.025) 1px, transparent 1px),
          var(--map-bg);
        background-size: 200px 200px, 240px 240px, 32px 32px, 32px 32px, 100% 100%;
      }

      .map-radius {
        position: absolute;
        left: 50%; top: 50%;
        width: 280px; height: 280px;
        margin-left: -140px; margin-top: -140px;
        border-radius: 50%;
        border: 1.5px solid var(--map-radius-stroke);
        background: var(--map-radius-fill);
        pointer-events: none;
      }
      .map-sweep {
        position: absolute;
        left: 50%; top: 50%;
        width: 280px; height: 280px;
        margin-left: -140px; margin-top: -140px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(31, 174, 90, 0) 0%, rgba(31, 174, 90, 0.18) 6%, rgba(31, 174, 90, 0) 25%);
        animation: cromio-sweep 5s linear infinite;
        pointer-events: none;
      }
      .map-self {
        position: absolute;
        left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
      }
      .map-pin {
        position: absolute;
        animation: cromio-pin-drop 350ms var(--ease-bounce) both;
        z-index: 6;
      }

      .map-top {
        position: absolute;
        top: 0; left: 0; right: 0;
        padding: max(var(--space-3), env(safe-area-inset-top)) var(--space-3) var(--space-3);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-2);
        z-index: 30;
        background: linear-gradient(180deg, var(--bg-base) 0%, transparent 100%);
      }

      .map-tabs {
        background: var(--bg-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        padding: 3px;
        display: inline-flex;
        gap: 2px;
      }
      .map-tabs button {
        width: 44px; height: 38px;
        display: grid; place-items: center;
        background: transparent;
        border: 0;
        cursor: pointer;
        color: var(--text-secondary);
        border-radius: var(--radius-sm);
      }
      .map-tabs button.is-active {
        background: var(--bg-base);
        color: var(--text-primary);
      }

      .map-cta-locate {
        position: absolute;
        right: var(--space-3);
        bottom: 180px;
        z-index: 30;
      }

      .map-radius-card {
        position: absolute;
        left: var(--space-3);
        right: var(--space-3);
        bottom: 96px;
        z-index: 25;
        background: var(--bg-elevated);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-lg);
        padding: var(--space-3) var(--space-4);
        backdrop-filter: blur(var(--blur-md));
      }
      .map-radius-card-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: var(--space-3);
      }
      .map-radius-card-label {
        font-size: var(--text-2xs);
        font-weight: var(--fw-bold);
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: var(--text-tertiary);
      }
      .map-radius-card-value {
        font-family: var(--font-display);
        font-size: var(--text-xl);
        color: var(--brand-300);
      }
      .map-radius-chips {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .map-radius-chips::-webkit-scrollbar { display: none; }
      .map-radius-chips button {
        flex-shrink: 0;
        height: 44px;
        padding: 0 var(--space-3);
        background: var(--bg-overlay);
        border: 0;
        border-radius: var(--radius-sm);
        font-family: var(--font-mono);
        font-size: var(--text-xs);
        font-weight: var(--fw-bold);
        color: var(--text-secondary);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .map-radius-chips button.is-active {
        background: var(--brand-500);
        color: white;
      }
      .map-radius-chips button.is-locked { opacity: 0.5; }

      .nav-bottom {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        z-index: 50;
        background: rgba(14, 18, 15, 0.82);
        backdrop-filter: blur(var(--blur-lg));
        border-top: 1px solid var(--border-subtle);
        padding-bottom: env(safe-area-inset-bottom);
      }
      [data-theme="light"] .nav-bottom { background: rgba(255, 255, 255, 0.88); }
      .nav-bottom-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        padding: 6px 0;
      }
      .nav-item {
        padding: 8px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: transparent;
        border: 0;
        color: var(--text-tertiary);
        font-size: 10px;
        cursor: pointer;
        font-weight: var(--fw-medium);
        position: relative;
      }
      .nav-item.is-active {
        color: var(--text-primary);
        font-weight: var(--fw-bold);
      }
      .nav-icon-wrap {
        position: relative;
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: var(--radius-sm);
      }
      .nav-item.is-active .nav-icon-wrap {
        background: var(--brand-bg);
        color: var(--brand-300);
      }
      .nav-badge {
        position: absolute;
        top: -2px;
        right: -4px;
        min-width: 16px; height: 16px; padding: 0 4px;
        border-radius: var(--radius-full);
        background: var(--danger);
        color: white;
        font-size: 9px;
        font-weight: var(--fw-bold);
        display: grid;
        place-items: center;
        border: 2px solid var(--bg-base);
      }
      [data-theme="light"] .nav-badge { border-color: var(--bg-surface); }

      .map-attribution {
        position: absolute;
        bottom: 86px;
        right: var(--space-2);
        font-size: 9.5px;
        color: var(--text-tertiary);
        background: var(--map-attribution-bg);
        padding: 2px 6px;
        border-radius: var(--radius-xs);
        z-index: 20;
      }
      .map-attribution a { color: inherit; text-decoration: underline; }
    </style>
  </head>
  <body>
    <button class="mockup-theme-toggle" id="themeToggle">DARK</button>

    <!-- Reusable SVG icon symbol sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15"/><path d="M15 6v15"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></symbol>
      <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
      <symbol id="i-album" viewBox="0 0 24 24"><path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16l7-3 7 3Z"/></symbol>
      <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="M12 3a9 9 0 0 1 9 9"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/></symbol>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
    </svg>

    <main class="mockup-frame">
      <div class="map-frame">
        <div class="map-canvas"></div>

        <div class="map-radius"></div>
        <div class="map-sweep"></div>
        <div class="map-self"><div class="me-dot"></div></div>

        <!-- Pines v2: frontales, con counts ▼N ▲N visibles -->
        <div class="map-pin" style="left: 18%; top: 24%;">
          <div class="pin" data-kind="match" data-trade-active>
            <div class="pin-counts">
              <span class="pin-tri-down"></span><span class="pin-num">1</span>
              <span class="pin-tri-up"></span><span class="pin-num">7</span>
            </div>
            <div class="pin-body"><div class="pin-avatar">DE</div></div>
          </div>
        </div>
        <div class="map-pin" style="left: 56%; top: 22%; animation-delay: 80ms;">
          <div class="pin" data-kind="match">
            <div class="pin-counts">
              <span class="pin-tri-down"></span><span class="pin-num">2</span>
              <span class="pin-tri-up"></span><span class="pin-num">6</span>
            </div>
            <div class="pin-body"><div class="pin-avatar">PA</div></div>
          </div>
        </div>
        <div class="map-pin" style="left: 36%; top: 48%; animation-delay: 160ms;">
          <div class="pin" data-kind="match">
            <div class="pin-counts">
              <span class="pin-tri-down"></span><span class="pin-num">1</span>
              <span class="pin-tri-up"></span><span class="pin-num">7</span>
            </div>
            <div class="pin-body"><div class="pin-avatar">CF</div></div>
          </div>
        </div>
        <div class="map-pin" style="left: 68%; top: 54%; animation-delay: 220ms;">
          <div class="pin" data-kind="gold">
            <div class="pin-counts">
              <span class="pin-tri-down"></span><span class="pin-num">3</span>
              <span class="pin-tri-up"></span><span class="pin-num">9</span>
            </div>
            <div class="pin-body"><div class="pin-avatar">JM</div></div>
          </div>
        </div>
        <div class="map-pin" style="left: 14%; top: 60%; animation-delay: 280ms;">
          <div class="pin" data-kind="lead">
            <div class="pin-counts">
              <span class="pin-tri-down"></span><span class="pin-num">4</span>
              <span class="pin-tri-up"></span><span class="pin-num">0</span>
            </div>
            <div class="pin-body"><div class="pin-avatar">LS</div></div>
          </div>
        </div>
        <div class="map-pin" style="left: 82%; top: 38%; animation-delay: 320ms;">
          <div class="pin-cluster">12</div>
        </div>

        <div class="map-top">
          <div></div>
          <div class="map-tabs">
            <button class="is-active" title="Mapa" aria-label="Mapa"><svg class="icon icon-sm"><use href="#i-map"/></svg></button>
            <button title="Lista" aria-label="Lista"><svg class="icon icon-sm"><use href="#i-list"/></svg></button>
          </div>
          <button class="icon-btn" title="Refrescar" aria-label="Refrescar"><svg class="icon icon-sm"><use href="#i-refresh"/></svg></button>
        </div>

        <button class="icon-btn map-cta-locate" title="Centrar mi ubicación" aria-label="Centrar">
          <svg class="icon icon-sm"><use href="#i-locate"/></svg>
        </button>

        <p class="map-attribution">
          © <a href="https://www.openstreetmap.org/copyright">OSM</a> · ©
          <a href="https://carto.com/attributions">CARTO</a>
        </p>

        <div class="map-radius-card">
          <div class="map-radius-card-top">
            <span class="map-radius-card-label">Radio de búsqueda</span>
            <span class="map-radius-card-value tabular">500m</span>
          </div>
          <div class="map-radius-chips">
            <button>200m</button>
            <button class="is-active">500m</button>
            <button>1km</button>
            <button>2km</button>
            <button class="is-locked"><svg class="icon icon-sm" style="width:12px;height:12px"><use href="#i-lock"/></svg>5km</button>
            <button class="is-locked"><svg class="icon icon-sm" style="width:12px;height:12px"><use href="#i-lock"/></svg>10km</button>
            <button class="is-locked"><svg class="icon icon-sm" style="width:12px;height:12px"><use href="#i-lock"/></svg>50km</button>
          </div>
        </div>

        <nav class="nav-bottom" aria-label="Primary">
          <div class="nav-bottom-grid">
            <button class="nav-item"><span class="nav-icon-wrap"><svg class="icon"><use href="#i-album"/></svg></span><span>Álbum</span></button>
            <button class="nav-item is-active"><span class="nav-icon-wrap"><svg class="icon"><use href="#i-radar"/></svg><span class="nav-badge">3</span></span><span>Radar</span></button>
            <button class="nav-item"><span class="nav-icon-wrap"><svg class="icon"><use href="#i-flag"/></svg></span><span>Contactos</span></button>
            <button class="nav-item"><span class="nav-icon-wrap"><svg class="icon"><use href="#i-chat"/></svg></span><span>Chats</span></button>
            <button class="nav-item"><span class="nav-icon-wrap"><svg class="icon"><use href="#i-user"/></svg></span><span>Perfil</span></button>
          </div>
        </nav>
      </div>
    </main>

    <script>
      const toggle = document.getElementById("themeToggle");
      const setTheme = (t) => {
        document.documentElement.setAttribute("data-theme", t);
        toggle.textContent = t.toUpperCase();
      };
      toggle.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme") || "dark";
        setTheme(cur === "dark" ? "light" : "dark");
      });
      setTheme("dark");
    </script>
  </body>
</html>
