<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cromio">
  <!-- Maskable: fondo SÓLIDO al borde (sin radius). El SO recorta. -->
  <rect width="512" height="512" fill="#1FAE5A"/>

  <!-- Glifo centrado al 80% (safe zone). Scale 0.8 desde el centro. -->
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)" fill="#FFFFFF">
    <!-- Anillo principal (abierto a la derecha) -->
    <path d="
      M256,116
      a140,140 0 1,1 0,280
      a140,140 0 0,1 0,-280
      Z
      M256,156
      a100,100 0 1,0 86,150
      l28,28
      a140,140 0 0,0 26,-78
      a140,140 0 0,0 -140,-140
      Z
    " fill-rule="evenodd"/>
    <!-- Disco interior -->
    <circle cx="256" cy="256" r="40"/>
    <!-- Dot satélite -->
    <circle cx="338" cy="328" r="14"/>
  </g>
</svg>
